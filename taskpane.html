<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<title>think-cell 风格图表</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<link rel="stylesheet" href="taskpane.css">
</head>
<body>
<header class="bar">
  <div class="brand"><span class="logo"></span>think-cell 风格图表</div>
  <div id="host" class="host">浏览器预览模式</div>
</header>

<main>
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div><b id="loadmsg">正在加载图表引擎…</b><br><small>首次约 20 MB，之后浏览器会缓存</small></div>
  </div>

  <section class="card">
    <label class="row">
      <span>图表类型</span>
      <select id="type"></select>
    </label>
    <p id="typehint" class="hint"></p>
  </section>

  <section class="card">
    <div class="rowhead">
      <span>数据 <small>（第一行为表头，可从 Excel 直接粘贴）</small></span>
      <span class="btns">
        <button id="btnSel" class="ghost xl-only" title="读取 Excel 当前选中区域">读取选区</button>
        <button id="btnSample" class="ghost">示例</button>
      </span>
    </div>
    <textarea id="data" spellcheck="false" rows="7"></textarea>
    <p id="dataErr" class="err"></p>
  </section>

  <section class="card">
    <label class="row"><span>标题</span><input id="title" placeholder="写结论，如：市场 4 年复合增长 8.6%"></label>
    <label class="row"><span>副标题</span><input id="subtitle" placeholder="指标，单位"></label>
    <label class="row"><span>来源</span><input id="source" placeholder="可留空"></label>
    <div class="grid3">
      <label><span>主题</span>
        <select id="theme"><option value="consulting">咨询蓝</option><option value="semi">半导体</option><option value="dark">深色</option></select></label>
      <label><span>小数位</span>
        <select id="dec"><option value="">自动</option><option>0</option><option>1</option><option>2</option></select></label>
      <label><span>尺寸</span>
        <select id="size"><option value="680x400">宽 16:9</option><option value="680x480">标准</option><option value="480x400">半页</option><option value="680x300">矮条</option></select></label>
    </div>
  </section>

  <section class="card" id="optCard">
    <div class="rowhead"><span>图表选项</span></div>
    <div id="opts"></div>
  </section>

  <section class="card" id="annCard">
    <div class="rowhead"><span>注释</span></div>
    <div id="anns"></div>
  </section>

  <section class="card">
    <div class="rowhead">
      <span>预览</span>
      <span id="meta" class="meta"></span>
    </div>
    <div id="preview" class="preview"><div class="empty">填好数据后自动预览</div></div>
  </section>

  <section class="actions">
    <div class="ppt-only">
      <button id="btnSvgPpt" class="primary">插入到当前页</button>
      <button id="btnSlide">作为新幻灯片插入（可编辑形状）</button>
      <p class="hint">插入到当前页后，右键 →「转换为形状」即可逐个元素编辑。</p>
    </div>
    <div class="xl-only">
      <button id="btnSvgXl" class="primary">插入图表（高保真）</button>
      <button id="btnNative">插入 Excel 原生图表（可改数据）</button>
      <p class="hint">原生图表可随单元格数据更新，但没有 CAGR / 差异箭头等注释。</p>
    </div>
    <div class="web-only">
      <button id="btnDlSvg" class="primary">下载 SVG</button>
      <button id="btnDlPng">下载 PNG</button>
      <button id="btnDlPptx">下载 PPTX</button>
    </div>
    <p id="status" class="status"></p>
  </section>

  <details class="card adv">
    <summary>高级：JSON 规格（可直接编辑，支持引擎全部参数）</summary>
    <textarea id="json" spellcheck="false" rows="12"></textarea>
    <div class="btns"><button id="btnJson" class="ghost">按 JSON 重新生成</button>
      <label class="chk"><input type="checkbox" id="jsonLock"> 锁定 JSON（不再从表单覆盖）</label></div>
  </details>
</main>
<script src="pyodide/pyodide.js"></script>
<script src="taskpane.js"></script>
</body>
</html>
